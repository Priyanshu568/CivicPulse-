<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CivicPulse — Sign in</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="centered-page">
  <div class="auth-card">
    <div class="brand"><span class="brand-dot"></span><h1>CivicPulse</h1></div>
    <p class="tagline">Hyperlocal public issue tracker &amp; routing engine</p>

    <div class="error-msg" id="errorMsg"></div>

    <!-- LOGIN FORM -->
    <form id="loginForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="loginEmail" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPassword" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary">Sign In</button>
    </form>

    <!-- REGISTER FORM -->
    <form id="registerForm" style="display:none;">
      <div class="field">
        <label>Full name</label>
        <input type="text" id="regName" required placeholder="Jane Citizen">
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="regEmail" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="regPassword" required minlength="6" placeholder="At least 6 characters">
      </div>
      <div class="field">
        <label>Account type</label>
        <select id="regRole">
          <option value="citizen">Citizen — report issues</option>
          <option value="department">Department staff — manage &amp; resolve</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary">Create Account</button>
    </form>

    <div class="switch-mode">
      <span id="toRegister">New here? <a>Create an account</a></span>
      <span id="toLogin" style="display:none;">Already have an account? <a>Sign in</a></span>
    </div>
  </div>
</div>

<script src="login.js"></script>
</body>
</html>
